# Tauplo with its own Postgres.   cp .env.production.example .env   (edit it)   then:   docker compose up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: tauplo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: tauplo
    volumes:
      - tauplo-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tauplo -d tauplo"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:?set SITE_URL in .env, for example https://tauplo.example.lt}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tauplo:${POSTGRES_PASSWORD}@db:5432/tauplo
      SITE_URL: ${SITE_URL:?set SITE_URL in .env, for example https://tauplo.example.lt}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"

volumes:
  tauplo-data:
